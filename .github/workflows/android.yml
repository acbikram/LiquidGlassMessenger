name: Android CI
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare persistent signing key
        if: ${{ env.SIGNING_KEY_BASE64 != '' }}
        run: |
          echo "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/liquidglass-release.jks"
          echo "SIGNING_KEY_PATH=$RUNNER_TEMP/liquidglass-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: ${{ env.SIGNING_KEY_BASE64 != '' && env.SIGNING_KEY_PASSWORD != '' && env.SIGNING_KEY_ALIAS != '' }}
        env:
          SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Build debug APK (temporary until signing secrets are configured)
        if: ${{ env.SIGNING_KEY_BASE64 == '' || env.SIGNING_KEY_PASSWORD == '' || env.SIGNING_KEY_ALIAS == '' }}
        run: gradle --no-daemon assembleDebug
      - name: Upload signed release APK
        if: ${{ env.SIGNING_KEY_BASE64 != '' && env.SIGNING_KEY_PASSWORD != '' && env.SIGNING_KEY_ALIAS != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassMessenger-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Upload temporary debug APK
        if: ${{ env.SIGNING_KEY_BASE64 == '' || env.SIGNING_KEY_PASSWORD == '' || env.SIGNING_KEY_ALIAS == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassMessenger-debug-apk-TEMPORARY
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
